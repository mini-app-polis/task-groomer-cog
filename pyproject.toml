[project]
name = "task-groomer-cog"
dynamic = ["version"]
description = "Grooms tasks on the board: reads a task and the code it names, and proposes what it should say so an agent can work it. Runs as the task-groomer-jobs Lambda worker; never writes to the board."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1.0",
    "miniapppolis-common-utils>=6.15.0,<7",
    "pydantic>=2.0.0,<3.0.0",
    "pyyaml>=6.0,<7.0",
    "sentry-sdk>=2.0.0,<3.0.0",
]

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "respx",
    "ruff",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/task_groomer_cog/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/task_groomer_cog"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["task_groomer_cog"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["src", "tests/unit"]
testpaths = ["tests/unit"]
addopts = "--cov=task_groomer_cog --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.coverage.report]
# TEST-019: CI fails below this floor. Raise it as coverage rises; lowering it is a reviewed edit.
fail_under = 85

[tool.uv]
# The uv every lock in the fleet is written with. setup-uv reads this in CI,
# and an older or newer local uv refuses to run instead of rewriting the
# lock's revision. Upgrading uv is a fleet sweep: bump this everywhere, then
# re-lock, in commits of their own.
required-version = "==0.13.0"
